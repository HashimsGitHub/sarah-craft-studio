<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discounts Admin | Sarah Craft Studio</title><meta name="description" content="Manage Sarah Craft Studio discount codes."><link rel="stylesheet" href="/css/style.css"></head><body><main><div class="admin-shell"><div class="admin-topbar"><div><a class="admin-brand" href="/"><img src="https://sarahcraftassets.blob.core.windows.net/site-assets/images/logo/fulllogo.png" alt="Sarah Craft Studio"></a><p>Store administration</p></div><a class="btn secondary" href="/.auth/logout?post_logout_redirect_uri=/">Logout</a></div><nav class="admin-nav"><a href="/admin/">Dashboard</a><a href="/admin/products.html">Products</a><a class="active" href="/admin/discounts.html">Discounts</a><a href="/admin/orders.html">Orders</a><a href="/">View Store</a></nav><div class="admin-heading"><div><p class="eyebrow">PROMOTIONS</p><h1>Discount Codes</h1><p>Create and manage percentage, fixed amount and free-shipping discounts.</p></div></div><div id="admin-status" class="admin-access">Checking administrator access…</div><div class="admin-panel"><div class="admin-panel-head"><h2 id="discount-form-title">Add discount</h2><button id="discount-cancel" class="btn secondary admin-small" type="button" hidden>Cancel edit</button></div><form id="admin-discount-form" class="admin-form-grid"><label>Code<input name="code" required placeholder="WELCOME10"></label><label>Type<select name="type"><option value="percentage">Percentage</option><option value="fixed">Fixed amount</option><option value="free_shipping">Free shipping</option></select></label><label>Value<input name="value" type="number" step="0.01" min="0" value="10"></label><label>Minimum order<input name="minimumOrder" type="number" step="0.01" min="0" value="0"></label><label>Usage limit<input name="usageLimit" type="number" min="0" placeholder="Unlimited"></label><label>Starts<input name="startsAt" type="date"></label
