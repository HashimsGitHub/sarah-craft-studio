<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products Admin | Sarah Craft Studio</title><meta name="description" content="Manage Sarah Craft Studio products."><link rel="stylesheet" href="/css/style.css"></head><body><main><div class="admin-shell"><div class="admin-topbar"><div><a class="admin-brand" href="/"><img src="https://sarahcraftassets.blob.core.windows.net/site-assets/images/logo/fulllogo.png" alt="Sarah Craft Studio"></a><p>Store administration</p></div><a class="btn secondary" href="/.auth/logout?post_logout_redirect_uri=/">Logout</a></div><nav class="admin-nav"><a href="/admin/">Dashboard</a><a class="active" href="/admin/products.html">Products</a><a href="/admin/discounts.html">Discounts</a><a href="/admin/orders.html">Orders</a><a href="/">View Store</a></nav><div class="admin-heading"><div><p class="eyebrow">CATALOGUE</p><h1>Products</h1><p>Add, update, hide or remove products stored in MongoDB.</p></div></div><div id="admin-status" class="admin-access">Checking administrator access…</div><div class="admin-panel"><div class="admin-panel-head"><h2 id="product-form-title">Add product</h2><button id="product-cancel" class="btn secondary admin-small" type="button" hidden>Cancel edit</button></div><form id="admin-product-form" class="admin-form-grid"><input type="hidden" name="id"><label>Name<input name="name" required></label><label>Slug / Product ID<input name="slug" required></label><label>Category<select name="category"><option value="drinkware">Drinkware</option><option value="stationery">Stationery</option><option value="home-decor">Home Decor</option><option value="digital">Digital</option><option value="personalized">Personalized</option><option value="gifts">Gifts</option></select></label><label>Price (CAD)<input name="price" type="number" step="0.01" min="0" required></label><label>Stock quantity<input name="stock" type="number" min="0" value="0"></label><label>Collections<input name="collections" placeholder="mothers-day, teachers"></label><label class="wide">Primary image URL<input name="image" placeholder="https://sarahcraftassets.blob.core.windows.net/..." required></label><label class="wide">Description<textarea name="description" rows="5"></textarea></label><label class="check"><input name="personalizable" type="checkbox"> Personalizable</label><label class="check"><input name="active" type="checkbox" checked> Active</label><div class="wide admin-actions"><button class="btn" type="submit">Save product</button><span id="admin-form-status" class="admin-save-status"></span></div></form></div><div class="admin-panel"><div class="admin-panel-head"><h2>Current products</h2><span>MongoDB catalogue</span></div><div id="admin-products"><div class="admin-loading">Loading products…</div></div></div><div id="admin-error" class="admin-error"></div></div><script src="/js/admin.js"></script></main></body></html>
