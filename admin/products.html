<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products Admin | Sarah Craft Studio</title><meta name="description" content="Manage Sarah Craft Studio products."><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin-product-table.css"></head><body><main><div class="admin-shell"><div class="admin-topbar"><div><a class="admin-brand" href="/"><img src="https://sarahcraftassets.blob.core.windows.net/site-assets/images/logo/fulllogo.png" alt="Sarah Craft Studio"></a><p>Store administration</p></div><a class="btn secondary" href="/.auth/logout?post_logout_redirect_uri=/">Logout</a></div><nav class="admin-nav"><a href="/admin/">Dashboard</a><a class="active" href="/admin/products.html">Products</a><a href="/admin/discounts.html">Discounts</a><a href="/admin/orders.html">Orders</a><a href="/">View Store</a></nav><div class="admin-heading"><div><p class="eyebrow">CATALOGUE</p><h1>Products</h1><p>Add, update, hide or remove products stored in MongoDB.</p></div></div><div id="admin-status" class="admin-access">Checking administrator access…</div><div class="admin-panel"><div class="admin-panel-head"><h2 id="product-form-title">Add product</h2><button id="product-cancel" class="btn secondary admin-small" type="button" hidden>Cancel edit</button></div><form id="admin-product-form" class="admin-form-grid"><input type="hidden" name="id"><label>Name<input name="name" required></label><label>Slug / Product ID<input name="slug" required></label><label>Category<select name="category"><option value="bookmark">Bookmark</option><option value="canvas-art">Canvas Art</option><option value="coasters">Coasters</option><option value="coloring-book">Coloring Book</option><option value="digital-downloads">Digital Downloads</option><option value="drinkware">Drinkware</option><option value="fathers-day-collection">Father's Day Collection</option><option value="glass-can">Glass Can</option><option value="home-decor">Home Decor</option><option value="keychains">Keychains</option><option value="kids">Kids</option><option value="magnets">Magnets</option><option value="moroccan-series">Moroccan Series</option><option value="personalized-gifts">Personalized Gifts</option><option value="planners">Planners</option><option value="stationery">Stationery</option><option value="stickers">Stickers</option><option value="wood-art-panel">Wood Art Panel</option></select></label><label>Price (CAD)<input name="price" type="number" step="0.01" min="0" required></label><label>Stock quantity<input name="stock" type="number" min="0" value="0"></label><label>Collections<input name="collections" placeholder="fathers-day-collection, personalized-gifts"></label><div class="wide"><label>Choose product image (JPG, PNG or WebP; optimized when saved)<input id="product-image-file" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="admin-actions"><span id="product-image-upload-status" class="admin-save-status"></span></div></div><label class="wide">Primary image URL<input name="image" placeholder="https://sarahcraftassets.blob.core.windows.net/site-assets/images/products/..."></label><label class="wide">Description<textarea name="description" rows="5"></textarea></label><label class="check"><input name="personalizable" type="checkbox"> Personalizable</label><label class="check"><input name="active" type="checkbox" checked> Active</label><div class="wide admin-actions"><button class="btn" type="submit">Save product</button><span id="admin-form-status" class="admin-save-status"></span></div></form></div><div class="admin-panel"><div class="admin-panel-head"><h2>Current products</h2><span>MongoDB catalogue</span></div><div id="product-table-controls" class="admin-product-controls"><label class="admin-search-field">Search product<input id="product-filter-search" type="search" placeholder="Name or Product ID"></label><label>Category<select id="product-filter-category"><option value="">All categories</option></select></label><label>Price (CAD)<span class="admin-product-range"><input id="product-filter-price-min" type="number" min="0" step="0.01" placeholder="Min"><input id="product-filter-price-max" type="number" min="0" step="0.01" placeholder="Max"></span></label><label>Stock<span class="admin-product-range"><input id="product-filter-stock-min" type="number" min="0" step="1" placeholder="Min"><input id="product-filter-stock-max" type="number" min="0" step="1" placeholder="Max"></span></label><label>Status<select id="product-filter-status"><option value="">All statuses</option><option value="Active">Active</option><option value="Hidden">Hidden</option></select></label><div class="admin-filter-actions"><button id="product-filter-clear" class="btn secondary admin-small" type="button">Clear filters</button></div></div><span id="product-filter-count" class="admin-product-count"></span><div id="admin-products"><div class="admin-loading">Loading products…</div></div></div><div id="admin-error" class="admin-error"></div></div><script src="/js/admin.js"></script><script src="/js/product-image-upload.js"></script><script src="/js/admin-product-table.js"></script></main></body></html>
